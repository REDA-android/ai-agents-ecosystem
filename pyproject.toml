[project]
name = "omniagent-platform"
version = "0.1.0"
description = "Unified AI Agent Operating System & Orchestration Hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "litellm>=1.44.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "crewai>=0.55.0",
    "llamaindex>=0.11.0",
    "chromadb>=0.5.0",
    "browser-use>=0.1.0",
    "playwright>=1.46.0",
    "rich>=13.8.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
