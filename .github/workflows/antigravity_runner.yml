name: Antigravity Runner (PC Éteint)

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'Prompt de la tâche à exécuter'
        required: true
        default: 'Analyse et mise à jour automatique'
  schedule:
    - cron: '0 2 * * *' # Exécution quotidienne à 02:00 UTC

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Exécution de la tâche Antigravity
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_PROMPT: ${{ github.event.inputs.task_prompt || 'Exécution planifiée en arrière-plan' }}
        run: |
          python scripts/run_task.py "$TASK_PROMPT"

      - name: Commit et Push des résultats sur GitHub
        run: |
          git config --global user.name "Antigravity Cloud Bot"
          git config --global user.email "bot@antigravity.ai"
          git add output/
          git commit -m "Auto: Résultats Antigravity [$(date -u +'%Y-%m-%d %H:%M UTC')]" || echo "Aucun changement à commiter"
          git push

      - name: Archiver les résultats comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-output-latest
          path: output/
